  <path d="M20 33 H26 M23 30 V36" stroke="#FFF7EA" stroke-width="2" stroke-linecap="round"></path>

  <!-- − -->
  <circle cx="41" cy="33" r="6" fill="#6F8755"></circle>
  <path d="M38 33 H44" stroke="#FFF7EA" stroke-width="2" stroke-linecap="round"></path>

  <!-- × -->
