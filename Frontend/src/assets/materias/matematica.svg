  <path d="M38 47 H44" stroke="#FFF7EA" stroke-width="2" stroke-linecap="round"></path>
  <circle cx="41" cy="43.5" r="1.2" fill="#FFF7EA"></circle>
  <circle cx="41" cy="50.5" r="1.2" fill="#FFF7EA"></circle>

  <!-- contorno leve -->
