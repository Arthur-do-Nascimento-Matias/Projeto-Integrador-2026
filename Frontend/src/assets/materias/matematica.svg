<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">

  <!-- corpo -->
  <rect x="13" y="7" width="38" height="50" rx="8" fill="#EDE5D8"></rect>

  <!-- visor -->
  <rect x="19" y="13" width="26" height="10" rx="3" fill="#5F7350"></rect>

  <!-- brilho do visor -->
  <path d="M22 16 H34" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" opacity="0.3"></path>

  <!-- + -->
