<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">

  <!-- pergaminho -->
  <rect x="14" y="14" width="28" height="34" rx="6" fill="#EDE5D8"></rect>

  <!-- rolos do pergaminho -->
  <circle cx="14" cy="20" r="5" fill="#D8C5A8"></circle>
  <circle cx="14" cy="42" r="5" fill="#D8C5A8"></circle>
  <circle cx="42" cy="20" r="5" fill="#D8C5A8"></circle>
  <circle cx="42" cy="42" r="5" fill="#D8C5A8"></circle>

  <!-- linhas do texto -->
  <path d="M21 24 H35
       M21 30 H33
       M21 36 H35" stroke="#A98B68" stroke-width="2" stroke-linecap="round" opacity="0.75"></path>

  <!-- pena -->
  <path d="M45 16
       C51 18, 54 25, 51 31
       C49 35, 44 38, 39 38
       C37 33, 38 27, 41 23
       C43 20, 44 18, 45 16Z" fill="#6F8C55"></path>

  <!-- detalhe interno da pena -->
  <path d="M41 35
       C43 31, 45 27, 47 22" fill="none" stroke="#EAF4E2" stroke-width="1.6" stroke-linecap="round" opacity="0.9"></path>

  <!-- cabo da pena -->
  <path d="M38 37 L49 49" stroke="#B56A48" stroke-width="3" stroke-linecap="round"></path>

  <!-- ponta -->
  <path d="M49 49 L52 53" stroke="#7A4B35" stroke-width="2.2" stroke-linecap="round"></path>

  <!-- brilho leve -->
  <path d="M20 18 H34" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" opacity="0.28"></path>

  <!-- contorno leve do pergaminho -->
  <rect x="14.5" y="14.5" width="27" height="33" rx="5.5" fill="none" stroke="#9C8D7D" stroke-width="1" opacity="0.45"></rect>

</svg>